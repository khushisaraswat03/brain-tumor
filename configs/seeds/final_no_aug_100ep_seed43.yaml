experiment_name: final_no_aug_100ep_seed43
seed: 43
device: cuda
checkpoint_dir: checkpoints
data:
  root_dir: dataset/BraTs2020/BraTS2020_TrainingData/MICCAI_BraTS2020_TrainingData
  val_frac: 0.15
  split_seed: 42
  norm_strategy: percentile_clip
  patch_size:
  - 96
  - 96
  - 96
model:
  in_channels: 4
  num_classes: 4
  base_channels: 8
  depth: 3
loss:
